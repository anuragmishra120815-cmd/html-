<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            background-color: #eae9e9;
            border: 4px solid black;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .product {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .price {
            font-weight: bold;
            color: #333;
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">Responsive Product Grid</div>

        <div class="product">
            <img src="bird image.jpg" alt="Product 1">
            <h3>Product 1</h3>
            <p>High-quality items with great features.</p>
            <span class="price">₹499</span>
        </div>

        <div class="product">
            <img src="bird image.jpg" alt="Product 2">
            <h3>Product 2</h3>
            <p>Durable and stylish for daily use.</p>
            <span class="price">₹799</span>
        </div>

        <div class="product">
            <img src="bird image.jpg" alt="Product 3">
            <h3>Product 3</h3>
            <p>Lightweight and comfortable.</p>
            <span class="price">₹1299</span>
        </div>

        <div class="product">
            <img src="bird image.jpg" alt="Product 4">
            <h3>Product 4</h3>
            <p>Trendy design with premium quality.</p>
            <span class="price">₹999</span>
        </div>
    </div>
</body>

</html>
